<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta property="og:title" content="{{I18N_MUSIC_SHARE}}">
  <meta property="og:description" content="{{I18N_PASSWORD_OG_DESCRIPTION}}">
  <title>{{I18N_MUSIC_SHARE}}</title>
  <link rel="icon" href="/fallback-cover.webp?v=20260903.3" type="image/webp">
  <link rel="stylesheet" href="/share.css?v=20260903.5">
  <script src="/i18n.js?v=20260903.1" defer></script>
  <script src="/share.js?v=20260903.6" defer></script>
</head>
<body class="password-page" data-auth-url="{{AUTH_PATH}}" data-retry-after="{{RETRY_AFTER}}">
  <div class="ambient ambient-coral" aria-hidden="true"></div>
  <main class="password-shell">
    <header class="password-brand">
      <img class="brand-mark" src="/fallback-cover.webp?v=20260903.3" alt="">
      <span>{{I18N_SHARED_FROM_PRIMUSE}}</span>
    </header>
    <section class="password-card">
      <div class="lock-mark" aria-hidden="true">
        <img class="ui-icon" src="/icons/lock.svg" alt="">
      </div>
      <p class="eyebrow">{{I18N_PASSWORD_EYEBROW}}</p>
      <h1>{{I18N_PASSWORD_TITLE}}</h1>
      <p>{{I18N_PASSWORD_COPY}}</p>
      <form class="password-form" method="post" action="{{AUTH_PATH}}" data-password-form>
        <label for="share-password">{{I18N_PASSWORD_LABEL}}</label>
        <div class="password-field {{ERROR_CLASS}}">
          <input id="share-password" name="password" type="password" autocomplete="current-password" maxlength="128" required autofocus aria-describedby="password-message">
          <button type="button" aria-label="{{I18N_SHOW_PASSWORD}}" data-toggle-password>{{I18N_SHOW}}</button>
        </div>
        <p id="password-message" class="form-message {{MESSAGE_CLASS}}" role="alert" aria-live="polite">{{MESSAGE}}</p>
        <button class="primary-button unlock-button" type="submit" data-unlock>
          <span data-unlock-label>{{I18N_UNLOCK}}</span><span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
    </section>
    <p class="password-footer">{{I18N_PASSWORD_FOOTER}}</p>
  </main>
</body>
</html>
